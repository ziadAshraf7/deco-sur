name: Deploy to Render

# This workflow is OPTIONAL.
# Render can auto-deploy on every push to `main` on its own (recommended, see README/notes).
# Use this workflow only if you turn Render's "Auto-Deploy" OFF and instead want
# deploys to be gated behind CI passing first.
#
# Setup:
# 1. In Render, open your Web Service -> Settings -> Deploy Hook, copy the URL.
# 2. In GitHub, go to Settings -> Secrets and variables -> Actions -> New repository secret
#    Name: RENDER_DEPLOY_HOOK
#    Value: <the deploy hook URL from Render>

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK }}"
